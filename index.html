<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PRO Нотариус 2026</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.6.0/mammoth.browser.min.js"></script>
    <style>
        :root {
            --bg-color: #0b1329;
            --card-bg: #162238;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --accent-blue: #2563eb;
            --accent-cyan: #38bdf8;
            --success-green: #10b981;
            --error-red: #ef4444;
            --border-color: #334155;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 16px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
        }

        .container {
            max-width: 720px;
            width: 100%;
        }

        .header-card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 16px;
        }

        h1 {
            color: var(--accent-cyan);
            margin: 0 0 10px 0;
            font-size: 22px;
        }

        .status {
            padding: 10px 14px;
            border-radius: 8px;
            background: #1e293b;
            font-size: 14px;
            color: var(--text-muted);
            margin-bottom: 12px;
        }

        .q-card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 20px;
        }

        .q-number {
            font-size: 13px;
            color: var(--accent-cyan);
            font-weight: bold;
            margin-bottom: 8px;
            text-transform: uppercase;
        }

        .q-title {
            font-size: 17px;
            line-height: 1.4;
            margin-bottom: 20px;
            font-weight: 600;
            white-space: pre-wrap;
        }

        .options-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .opt-btn {
            background: #1e293b;
            border: 1px solid var(--border-color);
            color: var(--text-main);
            padding: 14px 16px;
            border-radius: 8px;
            text-align: left;
            font-size: 15px;
            cursor: pointer;
            transition: all 0.2s;
            line-height: 1.3;
        }

        .opt-btn:hover {
            border-color: var(--accent-blue);
            background: #27354d;
        }

        .opt-btn.correct {
            background: rgba(16, 185, 129, 0.2) !important;
            border-color: var(--success-green) !important;
            color: #6ee7b7;
        }

        .opt-btn.wrong {
            background: rgba(239, 68, 68, 0.2) !important;
            border-color: var(--error-red) !important;
            color: #fca5a5;
        }

        .nav-btns {
            display: flex;
            justify-content: space-between;
            margin-top: 20px;
            gap: 10px;
        }

        .action-btn {
            background-color: var(--accent-blue);
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            flex: 1;
        }

        .action-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .file-label {
            display: inline-block;
            background-color: #334155;
            color: white;
            padding: 10px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
        }
        input[type="file"] { display: none; }
    </style>
</head>
<body>

<div class="container">
    <div class="header-card">
        <h1>PRO Нотариус 2026</h1>
        <div id="status" class="status">⏳ Авто-подключение к базе вопросов...</div>
        <label for="fileInput" class="file-label">
            📁 Загрузить файл с ПК
        </label>
        <input type="file" id="fileInput" accept=".docx">
    </div>

    <div id="quizContainer" class="q-card">
        <div id="qNumber" class="q-number">Вопрос 1</div>
        <div id="qTitle" class="q-title">Загрузка...</div>
        <div id="options" class="options-list"></div>
        
        <div class="nav-btns">
            <button id="prevBtn" class="action-btn" onclick="prevQuestion()" disabled>◄ Назад</button>
            <button id="nextBtn" class="action-btn" onclick="nextQuestion()">Вперёд ►</button>
        </div>
    </div>
</div>

<script>
    let questionsData = [];
    let currentIndex = 0;

    const statusEl = document.getElementById('status');

    // Автоматическая попытка загрузить файл из репозитория
    async function autoLoadRepoFile() {
        const fileNames = [
            "Вопросы Эталона 2026.docx",
            "Вопросы%20Эталона%202026.docx"
        ];

        for (let name of fileNames) {
            try {
                const res = await fetch(name);
                if (res.ok) {
                    const buffer = await res.arrayBuffer();
                    parseDocxBuffer(buffer);
                    return;
                }
            } catch(e) {}
        }
        statusEl.innerText = "ℹ️ Выберите файл .docx с устройства, если тест не запустился:";
    }

    function parseDocxBuffer(buffer) {
        statusEl.innerText = "⏳ Обработка документа...";
        mammoth.extractRawText({ arrayBuffer: buffer })
            .then(result => {
                parseFlexibleText(result.value);
            })
            .catch(err => {
                statusEl.innerText = "❌ Ошибка чтения формата .docx";
            });
    }

    // Мягкий парсер: подходит под любые маркеры и переносы
    function parseFlexibleText(fullText) {
        const rawLines = fullText.split('\n').map(s => s.trim()).filter(Boolean);
        parsed = [];
        let current = null;

        for (let line of rawLines) {
            // Если начинается с цифры, "Вопрос" или содержит '?' в конце короткой строки
            const isQuestionStart = /^\d+[\.\)\s]/i.test(line) || /^Вопрос/i.test(line);
            const isOption = /^[а-гa-d1-4][\.\)\-]/i.test(line) || /^[•\-–]/.test(line);

            if (isQuestionStart) {
                if (current && current.options.length > 0) parsed.push(current);
                current = { title: line, options: [], correctIndex: 0 };
            } else if (current) {
                if (isOption) {
                    current.options.push(line);
                } else {
                    if (current.options.length === 0) {
                        current.title += "\n" + line;
                    } else {
                        current.options[current.options.length - 1] += " " + line;
                    }
                }
            } else {
                // Если файл начался без цифры в 1 вопросе
                current = { title: line, options: [], correctIndex: 0 };
            }
        }
        if (current && current.options.length > 0) parsed.push(current);

        // Резервный вариант: делим просто по блокам, если спец-символов не было
        if (parsed.length === 0 && rawLines.length > 0) {
            let tempQ = { title: rawLines[0], options: [], correctIndex: 0 };
            for(let i = 1; i < rawLines.length; i++) {
                tempQ.options.push(rawLines[i]);
            }
            if(tempQ.options.length > 0) parsed.push(tempQ);
