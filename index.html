<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PRO Нотариус 2026</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.6.0/mammoth.browser.min.js"></script>
    <style>
        :root {
            --bg-color: #0b1329;
            --card-bg: #162238;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --accent-blue: #2563eb;
            --accent-cyan: #38bdf8;
            --success-green: #10b981;
            --error-red: #ef4444;
            --border-color: #334155;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 16px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
        }

        .container {
            max-width: 720px;
            width: 100%;
        }

        .header-card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 16px;
        }

        h1 {
            color: var(--accent-cyan);
            margin: 0 0 10px 0;
            font-size: 22px;
        }

        .status {
            padding: 10px 14px;
            border-radius: 8px;
            background: #1e293b;
            font-size: 14px;
            color: var(--text-muted);
            margin-bottom: 12px;
        }

        .q-card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 20px;
        }

        .q-number {
            font-size: 13px;
            color: var(--accent-cyan);
            font-weight: bold;
            margin-bottom: 8px;
            text-transform: uppercase;
        }

        .q-title {
            font-size: 17px;
            line-height: 1.4;
            margin-bottom: 20px;
            font-weight: 600;
        }

        .options-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .opt-btn {
            background: #1e293b;
            border: 1px solid var(--border-color);
            color: var(--text-main);
            padding: 14px 16px;
            border-radius: 8px;
            text-align: left;
            font-size: 15px;
            cursor: pointer;
            transition: all 0.2s;
            line-height: 1.3;
        }

        .opt-btn:hover {
            border-color: var(--accent-blue);
            background: #27354d;
        }

        .opt-btn.correct {
            background: rgba(16, 185, 129, 0.2) !important;
            border-color: var(--success-green) !important;
            color: #6ee7b7;
        }

        .opt-btn.wrong {
            background: rgba(239, 68, 68, 0.2) !important;
            border-color: var(--error-red) !important;
            color: #fca5a5;
        }

        .nav-btns {
            display: flex;
            justify-content: space-between;
            margin-top: 20px;
            gap: 10px;
        }

        .action-btn {
            background-color: var(--accent-blue);
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            flex: 1;
        }

        .action-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .file-label {
            display: inline-block;
            background-color: var(--accent-blue);
            color: white;
            padding: 10px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
        }
        input[type="file"] { display: none; }
    </style>
</head>
<body>

<div class="container">
    <div class="header-card">
        <h1>PRO Нотариус 2026</h1>
        <div id="status" class="status">✅ Приложение готово к работе</div>
        <label for="fileInput" class="file-label">
            📁 Загрузить файл с вопросами (.docx)
        </label>
        <input type="file" id="fileInput" accept=".docx">
    </div>

    <div id="quizContainer" class="q-card">
        <div id="qNumber" class="q-number">Вопрос 1</div>
        <div id="qTitle" class="q-title">Демо-вопрос: Что является предметом нотариальной деятельности?</div>
        <div id="options" class="options-list"></div>
        
        <div class="nav-btns">
            <button id="prevBtn" class="action-btn" onclick="prevQuestion()" disabled>◄ Назад</button>
            <button id="nextBtn" class="action-btn" onclick="nextQuestion()">Вперёд ►</button>
        </div>
    </div>
</div>

<script>
    let questionsData = [
        {
            title: "Демо-вопрос: Что является предметом нотариальной деятельности?",
            options: [
                "А) Удостоверение бесспорных прав и фактов",
                "Б) Рассмотрение уголовных дел",
                "В) Регистрация юридических лиц в налоговой",
                "Г) Вынесение судебных решений"
            ],
            correctIndex: 0
        }
    ];
    let currentIndex = 0;

    const statusEl = document.getElementById('status');

    function showQuestion(index) {
        if (index < 0 || index >= questionsData.length) return;
        currentIndex = index;
        const q = questionsData[index];

        document.getElementById('qNumber').innerText = `Вопрос ${index + 1} из ${questionsData.length}`;
        document.getElementById('qTitle').innerText = q.title;

        const optsContainer = document.getElementById('options');
        optsContainer.innerHTML = '';

        q.options.forEach((optText, optIdx) => {
            const btn = document.createElement('button');
            btn.className = 'opt-btn';
            btn.innerText = optText;
            btn.onclick = () => selectOption(btn, optIdx, q.correctIndex);
            optsContainer.appendChild(btn);
        });

        document.getElementById('prevBtn').disabled = (index === 0);
        document.getElementById('nextBtn').disabled = (index === questionsData.length - 1);
    }

    function selectOption(btn, selectedIdx, correctIdx) {
        const allBtns = document.querySelectorAll('.opt-btn');
        allBtns.forEach(b => b.onclick = null);

        if (selectedIdx === correctIdx) {
            btn.classList.add('correct');
        } else {
            btn.classList.add('wrong');
            if (allBtns[correctIdx]) {
                allBtns[correctIdx].classList.add('correct');
            }
        }
    }

    function prevQuestion() { showQuestion(currentIndex - 1); }
    function nextQuestion() { showQuestion(currentIndex + 1); }

    document.getElementById('fileInput').addEventListener('change', function(e) {
        const file = e.target.files[0];
        if (!file) return;

        statusEl.innerText = "⏳ Чтение файла...";
        const reader = new FileReader();
        reader.onload = function(e) {
            mammoth.extractRawText({ arrayBuffer: e.target.result })
                .then(result => {
                    parseText(result.value);
                })
                .catch(err => {
                    statusEl.innerText = "❌ Ошибка чтения .docx файла";
                });
        };
        reader.readAsArrayBuffer(file);
    });

    function parseText(text) {
        const lines = text.split('\n').map(l => l.trim()).filter(l => l.length > 0);
        const parsed = [];
        let currentQ = null;

        lines.forEach(line => {
            if (/^\d+[\.\)]/.test(line) || /^Вопрос\s+\d+/i.test(line)) {
                if (currentQ && currentQ.options.length > 0) parsed.push(currentQ);
                currentQ = { title: line, options: [], correctIndex: 0 };
            } else if (currentQ) {
                if (/^[а-гА-Гa-dA-D][\.\)]/.test(line) || /^[•\-–]/.test(line)) {
                    currentQ.options.push(line);
                } else {
                    if (currentQ.options.length === 0) currentQ.title += "\n" + line;
                    else currentQ.options[currentQ.options.length - 1] += " " + line;
                }
            }
        });
        if (currentQ && currentQ.options.length > 0) parsed.push(currentQ);

        if (parsed.length > 0) {
            questionsData = parsed;
            statusEl.innerText = `✅ Загружено вопросов из файла: ${parsed.length}`;
            statusEl.style.color = "#10b981";
            showQuestion(0);
        } else {
            statusEl.innerText = "⚠️ Не удалось распознать вопросы в файле";
        }
    }

    // Инициализация при старте
    showQuestion(0);
</script>

</body>
</html>
