<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>PRO Нотариус 2026</title>

    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.6.0/mammoth.browser.min.js"></script>

    <style>
        :root {
            --bg-color: #0b1329;
            --card-bg: #162238;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --accent-blue: #2563eb;
            --accent-cyan: #38bdf8;
            --success-green: #10b981;
            --error-red: #ef4444;
            --warning-amber: #f59e0b;
            --border-color: #334155;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            max-width: 800px;
            width: 100%;
        }

        .card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 24px;
            margin-bottom: 20px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }

        h1 {
            color: var(--accent-cyan);
            margin-top: 0;
        }

        .status {
            padding: 12px;
            border-radius: 8px;
            background: #1e293b;
            margin-bottom: 16px;
            font-size: 14px;
        }

        .btn {
            background-color: var(--accent-blue);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 16px;
            transition: background 0.2s;
        }

        .btn:hover {
            background-color: #1d4ed8;
        }

        input[type="file"] {
            display: none;
        }

        .file-label {
            display: inline-block;
            background-color: var(--border-color);
            color: var(--text-main);
            padding: 10px 20px;
            border-radius: 6px;
            cursor: pointer;
            margin-top: 10px;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="card">
        <h1>PRO Нотариус 2026</h1>
        <div id="status" class="status">⏳ Считываем репозиторий GitHub...</div>
        
        <label for="fileInput" class="file-label" id="uploadBtn" style="display: none;">
            📁 Выбрать файл .docx вручную
        </label>
        <input type="file" id="fileInput" accept=".docx,.xlsx">
    </div>

    <div id="quizContainer" class="card" style="display: none;">
        <h2 id="questionText">Вопрос загружается...</h2>
        <div id="optionsContainer"></div>
    </div>
</div>

<script>
    const TARGET_FILE = "Вопросы Эталона 2026.docx";
    const statusEl = document.getElementById('status');
    const uploadBtn = document.getElementById('uploadBtn');

    // Автоматическая загрузка файла из репозитория
    async function loadRepositoryFile() {
        const possiblePaths = [
            encodeURIComponent(TARGET_FILE),
            TARGET_FILE,
            "questions.docx"
        ];

        for (let path of possiblePaths) {
            try {
                const response = await fetch(path);
                if (response.ok) {
                    const arrayBuffer = await response.arrayBuffer();
                    parseDocx(arrayBuffer);
                    return;
                }
            } catch (e) {
                console.log("Пропуск пути:", path);
            }
        }

        statusEl.innerHTML = `⚠️ Файл <b>"${TARGET_FILE}"</b> не найден в репозитории.<br>Загрузите документ в GitHub или выберите его вручную ниже:`;
        uploadBtn.style.display = 'inline-block';
    }

    // Обработка docx через mammoth.js
    function parseDocx(arrayBuffer) {
        statusEl.innerText = "⏳ Парсинг вопросов из документа...";
        mammoth.extractRawText({ arrayBuffer: arrayBuffer })
            .then(result => {
                const text = result.value;
                if (text && text.trim().length > 0) {
                    statusEl.innerText = "✅ Вопросы успешно загружены!";
                    statusEl.style.color = "#10b981";
                    // Здесь вызывается логика отрисовки вашего теста
                    document.getElementById('quizContainer').style.display = 'block';
                } else {
                    statusEl.innerText = "❌ Не удалось прочитать текст из файла.";
                }
            })
            .catch(err => {
                console.error(err);
                statusEl.innerText = "❌ Ошибка при обработке .docx файла.";
            });
    }

    // Ручной выбор файла
    document.getElementById('fileInput').addEventListener('change', function(e) {
        const file = e.target.files[0];
        if (!file) return;
        
        const reader = new FileReader();
        reader.onload = function(e) {
            parseDocx(e.target.result);
        };
        reader.readAsArrayBuffer(file);
    });

    // Запуск при загрузке страницы
    window.addEventListener('DOMContentLoaded', loadRepositoryFile);
</script>

</body>
</html>
