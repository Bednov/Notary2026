<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PRO Нотариус 2026</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.6.0/mammoth.browser.min.js"></script>
    <style>
        :root {
            --bg-color: #0b1329;
            --card-bg: #162238;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --accent-blue: #2563eb;
            --accent-cyan: #38bdf8;
            --success-green: #10b981;
            --error-red: #ef4444;
            --border-color: #334155;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 16px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
        }

        .container {
            max-width: 720px;
            width: 100%;
        }

        .header-card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 16px;
        }

        h1 {
            color: var(--accent-cyan);
            margin: 0 0 10px 0;
            font-size: 22px;
        }

        .status {
            padding: 10px 14px;
            border-radius: 8px;
            background: #1e293b;
            font-size: 14px;
            color: var(--text-muted);
            margin-bottom: 12px;
        }

        .q-card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 20px;
        }

        .q-number {
            font-size: 13px;
            color: var(--accent-cyan);
            font-weight: bold;
            margin-bottom: 8px;
            text-transform: uppercase;
        }

        .q-title {
            font-size: 17px;
            line-height: 1.4;
            margin-bottom: 20px;
            font-weight: 600;
            white-space: pre-wrap;
        }

        .options-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .opt-btn {
            background: #1e293b;
            border: 1px solid var(--border-color);
            color: var(--text-main);
            padding: 14px 16px;
            border-radius: 8px;
            text-align: left;
            font-size: 15px;
            cursor: pointer;
            transition: all 0.2s;
            line-height: 1.3;
        }

        .opt-btn:hover {
            border-color: var(--accent-blue);
            background: #27354d;
        }

        .opt-btn.correct {
            background: rgba(16, 185, 129, 0.2) !important;
            border-color: var(--success-green) !important;
            color: #6ee7b7;
        }

        .opt-btn.wrong {
            background: rgba(239, 68, 68, 0.2) !important;
            border-color: var(--error-red) !important;
            color: #fca5a5;
        }

        .nav-btns {
            display: flex;
            justify-content: space-between;
            margin-top: 20px;
            gap: 10px;
        }

        .action-btn {
            background-color: var(--accent-blue);
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            flex: 1;
        }

        .action-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .file-label {
            display: inline-block;
            background-color: var(--border-color);
            color: white;
            padding: 10px 16px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            margin-top: 5px;
        }
        input[type="file"] { display: none; }
    </style>
</head>
<body>

<div class="container">
    <div class="header-card">
        <h1>PRO Нотариус 2026</h1>
        <div id="status" class="status">⏳ Авто-подключение к базе вопросов...</div>
        
        <label for="fileInput" class="file-label" id="uploadLabel" style="display: none;">
            📁 Выбрать файл вручную (.docx)
        </label>
        <input type="file" id="fileInput" accept=".docx">
    </div>

    <div id="quizContainer" class="q-card" style="display: none;">
        <div id="qNumber" class="q-number">Вопрос 1</div>
        <div id="qTitle" class="q-title"></div>
        <div id="options" class="options-list"></div>
        
        <div class="nav-btns">
            <button id="prevBtn" class="action-btn" onclick="prevQuestion()" disabled>◄ Назад</button>
            <button id="nextBtn" class="action-btn" onclick="nextQuestion()">Вперёд ►</button>
        </div>
    </div>
</div>

<script>
    let questionsData = [];
    let currentIndex = 0;
    const statusEl = document.getElementById('status');
    const uploadLabel = document.getElementById('uploadLabel');

    // Автоматическая загрузка при открытии страницы
    window.onload = async function() {
        try {
            const response = await fetch("Вопросы Эталона 2026.docx");
            if (!response.ok) {
                throw new Error("Файл не найден");
            }
            const arrayBuffer = await response.arrayBuffer();
            
            statusEl.innerText = "⏳ Распознавание текста...";
            
            mammoth.extractRawText({ arrayBuffer: arrayBuffer })
                .then(result => parseTextData(result.value))
                .catch(err => {
                    showError("Ошибка чтения документа.");
                });
        } catch (error) {
            showError("Не удалось скачать файл. GitHub Pages ещё обновляется.");
        }
    };

    function showError(msg) {
        statusEl.innerText = "❌ " + msg;
        statusEl.style.color = "#ef4444";
        uploadLabel.style.display = "inline-block"; // Показываем кнопку ручной загрузки
    }

    // Обработчик ручной загрузки (на случай если автозагрузка упадет)
    document.getElementById('fileInput').addEventListener('change', function(e) {
        const file = e.target.files[0];
        if (!file) return;

        statusEl.innerText = "⏳ Обработка локального файла...";
        statusEl.style.color = "#94a3b8";
        const reader = new FileReader();
        reader.onload = function(evt) {
            mammoth.extractRawText({ arrayBuffer: evt.target.result })
                .then(result => parseTextData(result.value))
                .catch(err => showError("Ошибка чтения файла .docx"));
        };
        reader.readAsArrayBuffer(file);
    });

    function parseTextData(fullText) {
        const lines = fullText.split('\n').map(l => l.trim()).filter(Boolean);
        questionsData = [];
        let currentQ = null;

        lines.forEach(line => {
            const isQStart = /^\d+[\.\)\s]/i.test(line) || /^Вопрос/i.test(line);
            const isOpt = /^[а-гa-d1-4][\.\)\-]/i.test(line) || /^[•\-–]/.test(line);

            if (isQStart && !isOpt) {
                if (currentQ && currentQ.options.length > 0) questionsData.push(currentQ);
                currentQ = { title: line, options: [], correctIndex: 0 };
            } else if (currentQ) {
                if (isOpt) {
                    currentQ.options.push(line);
                } else {
                    if (currentQ.options.length === 0) {
                        currentQ.title += "\n" + line;
                    } else {
                        currentQ.options[currentQ.options.length - 1] += " " + line;
                    }
                }
            }
        });

        if (currentQ && currentQ.options.length > 0) questionsData.push(currentQ);

        if (questionsData.length > 0) {
            statusEl.innerText = `✅ Успешно загружено вопросов: ${questionsData.length}`;
            statusEl.style.color = "#10b981";
            uploadLabel.style.display = "none";
            document.getElementById('quizContainer').style.display = 'block';
            showQuestion(0);
        } else {
            showError("Не удалось выделить варианты ответов.");
        }
    }

    function showQuestion(index) {
        if (index < 0 || index >= questionsData.length) return;
        currentIndex = index;
        const q = questionsData[index];

        document.getElementById('qNumber').innerText = `Вопрос ${index + 1} из ${questionsData.length}`;
        document.getElementById('qTitle').innerText = q.title;

        const optsContainer = document.getElementById('options');
        optsContainer.innerHTML = '';

        q.options.forEach((optText, optIdx) => {
            const btn = document.createElement('button');
            btn.className = 'opt-btn';
            btn.innerText = optText;
            btn.onclick = () => selectOption(btn, optIdx, q.correctIndex);
            optsContainer.appendChild(btn);
        });

        document.getElementById('prevBtn').disabled = (index === 0);
        document.getElementById('nextBtn').disabled = (index === questionsData.length - 1);
    }

    function selectOption(btn, selectedIdx, correctIdx) {
        const allBtns = document.querySelectorAll('.opt-btn');
        allBtns.forEach(b => b.onclick = null);

        if (selectedIdx === correctIdx) {
            btn.classList.add('correct');
        } else {
            btn.classList.add('wrong');
            if (allBtns[correctIdx]) {
                allBtns[correctIdx].classList.add('correct');
            }
        }
    }

    function prevQuestion() { showQuestion(currentIndex - 1); }
    function nextQuestion() { showQuestion(currentIndex + 1); }
</script>

</body>
</html>
